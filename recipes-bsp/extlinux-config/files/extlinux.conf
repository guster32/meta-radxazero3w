# extlinux.conf - Arcadia Linux Boot Configuration
# Multi-board support for Radxa Zero 3 series

DEFAULT arcadia-3w
TIMEOUT 30
MENU TITLE Arcadia Linux Boot Menu

LABEL arcadia-3w
    MENU LABEL Radxa Zero 3W (WiFi)
    LINUX /Image-initramfs-radxa-zero3w.bin
    FDT /rk3566-radxa-zero-3.dtb
    FDTOVERLAYS /rockchip/rk3566-radxa-zero-3w-board.dtbo
    APPEND root=LABEL=rootfs rootwait rw console=ttyS2,1500000 console=tty1 earlycon=uart8250,mmio32,0xfe660000 consoleblank=0 video=HDMI-A-1:1024x768@75 swiotlb=131072 splash quiet vt.global_cursor_default=0 loglevel=1

LABEL arcadia-3e
    MENU LABEL Radxa Zero 3E (Ethernet)
    LINUX /Image-initramfs-radxa-zero3w.bin
    FDT /rk3566-radxa-zero-3.dtb
    FDTOVERLAYS /rockchip/rk3566-radxa-zero-3e-board.dtbo
    APPEND root=LABEL=rootfs rootwait rw console=ttyS2,1500000 console=tty1 earlycon=uart8250,mmio32,0xfe660000 consoleblank=0 video=HDMI-A-1:1024x768@75 swiotlb=131072 splash quiet vt.global_cursor_default=0 loglevel=1
