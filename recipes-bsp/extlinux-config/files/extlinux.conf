# extlinux.conf - Arcadia Linux Boot Configuration with DTBO Support
# Multi-boot menu for different hardware configurations

DEFAULT arcadia-base
TIMEOUT 30
MENU TITLE Arcadia Linux Boot Menu

LABEL arcadia-base
    MENU LABEL Arcadia Linux (No Camera/Video)
    LINUX /Image-initramfs-radxa-zero3w.bin
    FDT /rk3566-radxa-zero-3w.dtb
    APPEND root=LABEL=rootfs rootwait rw console=ttyS2,1500000 console=tty1 earlycon=uart8250,mmio32,0xfe660000 consoleblank=0 video=HDMI-A-1:1024x768@75 swiotlb=131072 splash quiet vt.global_cursor_default=0 loglevel=1

LABEL arcadia-imx708
    MENU LABEL Arcadia Linux + IMX708 Camera
    LINUX /Image-initramfs-radxa-zero3w.bin
    FDT /rk3566-radxa-zero-3w.dtb
    FDTOVERLAYS /rockchip/rk3566-radxa-zero-3w-imx708.dtbo
    APPEND root=LABEL=rootfs rootwait rw console=ttyS2,1500000 console=tty1 earlycon=uart8250,mmio32,0xfe660000 consoleblank=0 video=HDMI-A-1:1024x768@75 swiotlb=131072 splash quiet vt.global_cursor_default=0 loglevel=1

