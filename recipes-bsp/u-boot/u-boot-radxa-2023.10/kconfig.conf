CONFIG_EFI_LOADER=n
CONFIG_CMD_EFI=n
CONFIG_EFI_PARTITION=n
CONFIG_EFI_PARTITION_ENTRIES_NUMBERS=128
CONFIG_EFI_PARTITION_ENTRIES_OFF=0
CONFIG_SPL_EFI_PARTITION=n
# Disable FIT signature verification to avoid ATF hash issues
CONFIG_SPL_FIT_SIGNATURE=n
CONFIG_SPL_CRYPTO_SUPPORT=n
CONFIG_SPL_HASH_SUPPORT=n

# Enable extlinux/syslinux support for boot configuration
CONFIG_CMD_SYSBOOT=y
CONFIG_DISTRO_DEFAULTS=y
CONFIG_CMD_EXTLINUX=y

# Extra logging for boot issues
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=7

# TPL/SPL Configuration for 2-stage boot
CONFIG_SPL=y
CONFIG_SPL_DTB=y
CONFIG_TPL=y
CONFIG_BINMAN=y
CONFIG_ROCKCHIP_TPL=y
CONFIG_SPL_FRAMEWORK=y
# CONFIG_SPL_BOARD_INIT is not set
CONFIG_SPL_STACK_R=y
CONFIG_SPL_STACK_R_MALLOC_SIMPLE_LEN=0x10000
CONFIG_SPL_MMC_SUPPORT=y
CONFIG_SPL_SERIAL_SUPPORT=y
CONFIG_SPL_DRIVERS_MISC_SUPPORT=y
CONFIG_SPL_LIBCOMMON_SUPPORT=y
CONFIG_SPL_LIBGENERIC_SUPPORT=y
CONFIG_SPL_GPIO_SUPPORT=y
CONFIG_SPL_OF_CONTROL=y
# CONFIG_SPL_OF_PLATDATA is not set
CONFIG_SPL_REGMAP=y
CONFIG_SPL_SYSCON=y
CONFIG_SPL_CLK=y
CONFIG_SPL_PINCTRL=y
CONFIG_SPL_RAM=y
CONFIG_SPL_DM=y
CONFIG_SPL_DM_SEQ_ALIAS=y
CONFIG_SPL_POWER_SUPPORT=y
CONFIG_SPL_ATF=y
CONFIG_SPL_ATF_NO_PLATFORM_PARAM=y

CONFIG_VIDEO=y
CONFIG_DM_VIDEO=y
CONFIG_VIDEO_ROCKCHIP=y   # Rockchip DRM/KMS driver
# CONFIG_CMD_BMP=y          # if you want U-Boot to show bmp logo
# CONFIG_SPLASH_SCREEN=y    # allow U-Boot splash
# CONFIG_SPLASH_SOURCE=y    # allow loading from bmp file
CONFIG_CONSOLE_MUX=y
CONFIG_CFB_CONSOLE=y
CONFIG_VGA_AS_SINGLE_DEVICE=y
CONFIG_SYS_WHITE_ON_BLACK=y

# Disable built-in logo, we’ll provide splash later
# CONFIG_VIDEO_BMP_LOGO is not set
# CONFIG_SPLASH_SCREEN_ALIGN is not set


CONFIG_BOOTCOMMAND="bootflow scan -b"
