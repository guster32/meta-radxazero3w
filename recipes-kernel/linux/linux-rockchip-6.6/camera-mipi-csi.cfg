# MIPI CSI Camera Infrastructure Configuration
# Complete configuration for Sony IMX708 camera sensor on RK3566
#
# NOTE: Only augments rockchip_linux_defconfig
# Defconfig already has:
#   - MEDIA_SUPPORT=y, VIDEO_ROCKCHIP_CIF=y, VIDEO_ROCKCHIP_ISP=y
#   - VIDEO_ROCKCHIP_RGA=y, VIDEO_RK628_CSI=y
#   - I2C, REGULATOR, GPIO, DMA, IOMMU, DRM support
#   - Many camera sensors (GC8034, OV13850, OV4689, OV5695, OV7251, etc.)

# === Ensure CPU type is set (required for VOP2) ===
CONFIG_CPU_RK3568=y

# === Ensure Rockchip VOP2 display controller is enabled ===
CONFIG_ROCKCHIP_VOP2=y

# === Ensure Rockchip DRM is built-in (NOT modular) ===
CONFIG_DRM_ROCKCHIP=y

# === Keep all dependent drivers built-in as well ===
CONFIG_RK628_MISC=y
CONFIG_RK628_MISC_HDMITX=y
CONFIG_MFD_RKX110_X120=y
CONFIG_DRM_PANEL_SIMPLE=y

# === Ensure MIPI DSI bus support is also built-in ===
# (Already added to camera-mipi-csi.cfg but doesn't hurt to reinforce)
CONFIG_DRM_MIPI_DSI=y


# === V4L2 Core Infrastructure ===
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_MEDIA_CONTROLLER_DVB=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# === MIPI DSI Bus Support (CRITICAL - fixes linking errors) ===
# Defconfig has ROCKCHIP_DW_MIPI_DSI=y but missing the core bus driver!
CONFIG_DRM_MIPI_DSI=y

# === Sony IMX708 Camera Sensor (NEW - not in defconfig) ===
CONFIG_VIDEO_IMX708=y

# === V4L2 Subdevice API (needed for IMX708 control) ===
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# === V4L2 Memory Management ===
CONFIG_VIDEOBUF2_CORE=y
CONFIG_VIDEOBUF2_MEMOPS=y
CONFIG_VIDEOBUF2_V4L2=y
CONFIG_VIDEOBUF2_DMA_CONTIG=y
CONFIG_VIDEOBUF2_VMALLOC=y
CONFIG_V4L2_MEM2MEM_DEV=y
CONFIG_V4L2_FWNODE=y

# === MIPI CSI-2 Framework ===
CONFIG_VIDEO_V4L2_I2C=y
CONFIG_V4L2_FWNODE=y
CONFIG_V4L2_ASYNC=y

# === Media Controller ===
CONFIG_MEDIA_CONTROLLER=y
CONFIG_MEDIA_CONTROLLER_DVB=y

# === Rockchip MIPI D-PHY ===
CONFIG_PHY_ROCKCHIP_MIPI_RX=y

# === Rockchip Camera Interface (RKCIF) ===
CONFIG_VIDEO_ROCKCHIP_CIF=y

# === Rockchip ISP (Image Signal Processor) ===
CONFIG_VIDEO_ROCKCHIP_ISP=y
CONFIG_VIDEO_ROCKCHIP_ISP_VERSION_V1=y
# Note: RK3566 uses ISP v1, not v2/v3

# === Sony IMX708 Camera Sensor ===
CONFIG_VIDEO_IMX708=y

# === Rockchip HDMI to MIPI CSI bridge ===
CONFIG_VIDEO_RK628=y
CONFIG_VIDEO_RK628_CSI=y

# === I2C for Camera Control ===
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_MUX=y
CONFIG_I2C_RK3X=y

# === GPIO Support (for camera power/reset) ===
CONFIG_GPIOLIB=y
CONFIG_GPIO_SYSFS=y
CONFIG_OF_GPIO=y

# === Clock Framework (for camera MCLK) ===
CONFIG_COMMON_CLK=y
CONFIG_COMMON_CLK_ROCKCHIP=y

# === Camera Support ===
CONFIG_MEDIA_CAMERA_SUPPORT=y

# === Regulator Framework (for camera power rails) ===
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# === Additional V4L2 Utilities ===
CONFIG_VIDEO_V4L2_TPG=m
CONFIG_V4L2_FLASH_LED_CLASS=m

# === Media Platform Drivers ===
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_PLATFORM_DRIVERS=y
CONFIG_V4L_PLATFORM_DRIVERS=y

# === Image Processing Support ===
CONFIG_VIDEO_V4L2_I2C=y

# === Debug Support (optional but helpful) ===
CONFIG_VIDEO_ADV_DEBUG=y
CONFIG_VIDEO_FIXED_MINOR_RANGES=y

# === DMA Engine (required by videobuf2) ===
CONFIG_DMADEVICES=y
CONFIG_DMA_ENGINE=y
CONFIG_DMA_OF=y
CONFIG_PL330_DMA=y

# === IOMMU Support (required by ISP) ===
CONFIG_IOMMU_SUPPORT=y
CONFIG_IOMMU_API=y
CONFIG_OF_IOMMU=y
CONFIG_ROCKCHIP_IOMMU=y

# === Device Tree Overlay Support ===
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y

# === Additional Camera Sensors (optional) ===
# Uncomment if you plan to support other sensors
# CONFIG_VIDEO_OV5647=m
# CONFIG_VIDEO_IMX219=m
# CONFIG_VIDEO_IMX477=m
# CONFIG_VIDEO_IMX519=m
CONFIG_VIDEO_IMX708=y

# === Video Output for Preview/Testing ===
CONFIG_DRM=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_VOP=y
CONFIG_ROCKCHIP_VOP2=y

# === V4L2 Control Framework ===
CONFIG_VIDEO_V4L2_COMMON=y

