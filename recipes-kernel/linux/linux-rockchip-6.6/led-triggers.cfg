# LED Trigger Support Configuration
# Required for dynamic LED behavior (heartbeat, timer, etc.)
#
# NOTE: Augments rockchip_linux_defconfig
# Defconfig already has: NEW_LEDS=y, LEDS_CLASS=y, LEDS_GPIO=y
# This adds the trigger subsystem that was missing

# === LED Trigger Framework ===
CONFIG_LEDS_TRIGGERS=y

# === Common LED Triggers ===
CONFIG_LEDS_TRIGGER_TIMER=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# === Optional Triggers (useful for various use cases) ===
CONFIG_LEDS_TRIGGER_BACKLIGHT=m
CONFIG_LEDS_TRIGGER_DEFAULT_ON=y
CONFIG_LEDS_TRIGGER_DISK=y
CONFIG_LEDS_TRIGGER_CPU=y
