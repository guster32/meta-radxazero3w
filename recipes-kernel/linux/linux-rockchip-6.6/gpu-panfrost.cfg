# GPU Driver Configuration - Panfrost (Open-Source Mesa)
# Replaces ARM proprietary Mali drivers with open-source Panfrost
# Required for Mesa/Wayland graphics acceleration
#
# NOTE: Augments rockchip_linux_defconfig
# Defconfig has: MALI400=y, MALI450=y, MALI_MIDGARD=y, DRM_ROCKCHIP=y
# This config disables Mali and enables Panfrost instead

# === Disable ARM Proprietary Mali Drivers (defconfig has them enabled) ===
# CONFIG_MALI400 is not set
# CONFIG_MALI450 is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_KBASE is not set
# CONFIG_MALI_UTGARD is not set
# CONFIG_MALI_EXPERT is not set
# CONFIG_MALI_PLATFORM_THIRDPARTY is not set
# CONFIG_MALI_DEBUG is not set
# CONFIG_MALI_PWRSOFT_765 is not set
# CONFIG_MALI_SHARED_INTERRUPTS is not set
# CONFIG_MALI_DT is not set
# CONFIG_MALI_DEVFREQ is not set

# === Enable Panfrost Open-Source Driver ===
CONFIG_DRM_PANFROST=y
CONFIG_DRM_PANFROST_THERMAL=y

# === Rockchip DRM/HDMI already enabled in defconfig ===
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_DW_HDMI=y
