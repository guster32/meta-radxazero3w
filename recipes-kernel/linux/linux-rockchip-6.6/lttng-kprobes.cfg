# Tracing / Kprobes support for LTTng-modules
#
# lttng-modules >= 2.14 hard-requires CONFIG_KPROBES on kernels >= 5.7
# (see src/wrapper/kallsyms.c: `#error "LTTng-modules requires
# CONFIG_KPROBES on kernels >= 5.7.0"`).
#
# The rockchip_linux_defconfig we ship through SRC_URI does not enable
# CONFIG_KPROBES, so lttng-modules fails to build with:
#   kallsyms.c:20:3: error: #error "LTTng-modules requires CONFIG_KPROBES on kernels >= 5.7.0"
#   make[4]: *** [.../src/wrapper/kallsyms.o] Error 1
#
# Also enable CONFIG_KPROBES_ON_FTRACE which lttng-modules probes for;
# it's the canonical companion and adds no runtime cost when not used.
# Both entries are CONFIG_*=y style so they survive KCONFIG_MODE=alldefconfig
# merges and do not depend on a particular defconfig baseline.

# === Kprobes ===
CONFIG_KPROBES=y
CONFIG_KPROBES_ON_FTRACE=y
