# PSplash / Framebuffer Console Configuration
# Required for boot splash screen (psplash) and early boot display

# === Core Framebuffer Support ===
CONFIG_FB=y
CONFIG_FB_DEVICE=y
CONFIG_FB_CORE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FRAMEBUFFER_CONSOLE_ROTATION=y

# === DRM Framebuffer Emulation ===
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100

# === Logo Support (for early boot) ===
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_MONO=y
CONFIG_LOGO_LINUX_VGA16=y
CONFIG_LOGO_LINUX_CLUT224=y

# === Virtual Terminal Support
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_CONSOLE_SLEEP=y
CONFIG_VT_HW_CONSOLE_BINDING=y

# === Console Fonts ===
CONFIG_FONTS=y
CONFIG_FONT_8x8=y
CONFIG_FONT_8x16=y
CONFIG_FONT_AUTOSELECT=y

# === DRM Core (should already be enabled but ensure) ===
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_KMS_FB_HELPER=y

# === Dummy Display Driver (fallback) ===
CONFIG_DRM_VKMS=m

# === Early printk / console ===
# CONFIG_FB_SIMPLE is not set (conflicts with DRM fbdev)
