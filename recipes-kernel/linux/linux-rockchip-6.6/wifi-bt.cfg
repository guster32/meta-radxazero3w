# WiFi and Bluetooth Configuration for Radxa Zero 3W
#
# Radxa Zero 3W uses AIC8800 WiFi 6 (802.11ax) / BT 5.4 module
# 
# NOTE: This config only augments rockchip_linux_defconfig
# The defconfig already includes:
#   - Basic Bluetooth stack (BT, BT_RFCOMM, BT_HIDP, BT_HCIUART, etc.)
#   - RFKILL support
#   - Basic WiFi infrastructure (WL_ROCKCHIP, AP6XXX)
#
# This fragment adds only what's missing:
#   - CFG80211/MAC80211 wireless stack (required for AIC8800 and most WiFi drivers)
#   - Additional BT features (BT_BREDR, BT_LE, vendor-specific drivers)
#   - Extended WiFi driver support

# ============================================================================
# Bluetooth Extensions (augments existing BT support in defconfig)
# ============================================================================
# Core BT features not in defconfig
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_DEBUGFS=y

# Additional HCI features not in defconfig
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIBTUSB_BCM=y
CONFIG_BT_HCIBTUSB_RTL=y

# Vendor-specific Bluetooth drivers not in defconfig
CONFIG_BT_BCM=y
CONFIG_BT_INTEL=y
CONFIG_BT_RTL=y

# ============================================================================
# CFG80211 / Wireless Core (Required for all WiFi drivers)
# ============================================================================
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_CFG80211_DEFAULT_PS=y
CONFIG_CFG80211_DEBUGFS=y
CONFIG_CFG80211_CRDA_SUPPORT=y
CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y
CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=y

# ============================================================================
# MAC80211 Stack (IEEE 802.11 implementation)
# ============================================================================
CONFIG_MAC80211=y
CONFIG_MAC80211_HAS_RC=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT="minstrel_ht"
CONFIG_MAC80211_LEDS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_MAC80211_DEBUG_MENU=y
CONFIG_MAC80211_VERBOSE_DEBUG=y
CONFIG_MAC80211_STA_HASH_MAX_SIZE=0

# ============================================================================
# AIC8800 WiFi 6 (802.11ax) / BT 5.4 Driver
# ============================================================================
CONFIG_AIC_WLAN_SUPPORT=y
CONFIG_AIC8800_WLAN_SUPPORT=y

# ============================================================================
# Additional WiFi Drivers (for USB dongles and other modules)
# ============================================================================

# Realtek USB WiFi
CONFIG_RTL_CARDS=m

# Ralink/MediaTek USB WiFi
CONFIG_RT2X00=y
CONFIG_RT2800USB=y
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT53XX=y

# Intel WiFi (for WiFi 6 modules)
CONFIG_IWLWIFI=m
CONFIG_IWLWIFI_LEDS=y
CONFIG_IWLWIFI_DEVICE_TRACING=y
CONFIG_IWLWIFI_OPMODE_MODULAR=y
CONFIG_IWLMVM=m

# Marvell WiFi
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_SDIO=m
CONFIG_LIBERTAS_THINFIRM=m

# ============================================================================
# Wireless Extensions (Legacy API compatibility)
# ============================================================================
CONFIG_WIRELESS=y
CONFIG_WEXT_CORE=y
CONFIG_WEXT_PROC=y
CONFIG_WLAN=y

# ============================================================================
# Wireless Vendor Support
# ============================================================================
CONFIG_WLAN_VENDOR_ATH=y
CONFIG_WLAN_VENDOR_ATMEL=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_WLAN_VENDOR_CISCO=y
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_WLAN_VENDOR_INTERSIL=y
CONFIG_WLAN_VENDOR_MARVELL=y
CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_WLAN_VENDOR_MICROCHIP=y
CONFIG_WLAN_VENDOR_QUANTENNA=y
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_WLAN_VENDOR_RSI=y
CONFIG_WLAN_VENDOR_ST=y
CONFIG_WLAN_VENDOR_TI=y
CONFIG_WLAN_VENDOR_ZYDAS=y

# ============================================================================
# RFKILL LED Support (defconfig already has CONFIG_RFKILL=y)
# ============================================================================
CONFIG_RFKILL_LEDS=y

# ============================================================================
# Networking Testmode (for nl80211 testmode API)
# ============================================================================
CONFIG_NL80211_TESTMODE=y
