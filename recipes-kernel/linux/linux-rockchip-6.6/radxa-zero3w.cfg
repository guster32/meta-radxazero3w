# Radxa Zero 3W kernel configuration fragment
# Applied AFTER rockchip_linux_defconfig - overrides defconfig settings
#
# Hardware: RK3566 SoC, RK817 PMIC, TCS4525 CPU regulator, AIC8800 WiFi/BT
# This config disables drivers for hardware NOT present on Radxa Zero 3W

#
# Camera Support
#
CONFIG_VIDEO_IMX708=m

#
# WiFi/Bluetooth - AIC8800
#
CONFIG_AIC8800_WLAN_SUPPORT=y
CONFIG_AIC_BTUSB_SUPPORT=y

#
# Regulators - Only TCS4525 and RK817 on this board
#
# CPU regulator is TCS4525
CONFIG_REGULATOR_FAN53555=n
CONFIG_REGULATOR_PWM=n
CONFIG_REGULATOR_FAN53880=y
# PMIC is RK817 (part of RK808 family)
CONFIG_MFD_RK808=y
CONFIG_REGULATOR_RK808=y

#
# Disable other SoC families (board is RK3566 only)
#
# RK3588 specific
CONFIG_ROCKCHIP_CPUINFO=n
CONFIG_CRYPTO_DEV_ROCKCHIP_DEV=n
# RK3399 specific  
CONFIG_PCIE_ROCKCHIP_HOST=n
CONFIG_PHY_ROCKCHIP_PCIE=n
CONFIG_PHY_ROCKCHIP_TYPEC=n
CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=n

#
# PCIe/SATA/NVMe - Not present on Radxa Zero 3W
#
CONFIG_PCIEPORTBUS=n
CONFIG_SATA_AHCI=n
CONFIG_SATA_AHCI_PLATFORM=n
CONFIG_NVME_CORE=n

#
# USB - Only USB 2.0, no USB 3.0 or Type-C DP
#
CONFIG_USB_DWC3=n
CONFIG_PHY_ROCKCHIP_INNO_USB3=n
CONFIG_USB_TYPEC=n
CONFIG_TYPEC_TCPM=n
CONFIG_TYPEC_FUSB302=n

#
# Display - Only HDMI, no DSI/eDP/DP
#
CONFIG_DRM_PANEL_SIMPLE=n
CONFIG_DRM_DISPLAY_CONNECTOR=n
CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY=n

#
# Disable other WiFi/BT chips not on board
#
CONFIG_BRCMFMAC=n
CONFIG_BT_HCIUART_BCM=n
CONFIG_RTL8822BS=n
CONFIG_RTW88=n

#
# Disable unused camera sensors
#
CONFIG_VIDEO_OV5640=n
CONFIG_VIDEO_OV5647=n
CONFIG_VIDEO_IMX219=n
CONFIG_VIDEO_IMX355=n
