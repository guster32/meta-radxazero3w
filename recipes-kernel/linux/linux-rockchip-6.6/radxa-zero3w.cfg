# Radxa Zero 3W kernel configuration fragment
# Only adds hardware NOT in rockchip_linux_defconfig

# IMX708 camera sensor (not in defconfig)
CONFIG_VIDEO_IMX708=m

# AIC8800 WiFi/Bluetooth (not in defconfig)
CONFIG_AIC8800_WLAN_SUPPORT=m

# Regulator configuration - Board has TCS4525 (FAN53880 family), not FAN53555
# Disable FAN53555 driver to prevent probe conflict at I2C address 0x1c
CONFIG_REGULATOR_FAN53555=n
# Enable FAN53880 driver for TCS4525 support
CONFIG_REGULATOR_FAN53880=y
