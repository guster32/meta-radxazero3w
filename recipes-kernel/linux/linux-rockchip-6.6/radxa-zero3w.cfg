# Radxa Zero 3W Kernel Configuration Fragment
# 
# This is the main board-specific configuration.
# Additional features are split into separate files:
#   - wifi-bt.cfg: WiFi 6 (802.11ax) and Bluetooth 5.4 stack
#   - psplash-fb.cfg: Framebuffer/boot splash support
#   - camera-mipi-csi.cfg: Complete MIPI CSI camera infrastructure
#   - gpu-panfrost.cfg: Open-source Panfrost GPU driver
#
# Only augments rockchip_linux_defconfig - do not duplicate defaults

# === Video Codec Support (Rockchip Vendor - NEW, not in defconfig) ===
# Defconfig has: CONFIG_REGULATOR_FAN53555=y (already present)
CONFIG_VIDEO_ROCKCHIP_VDEC=y
CONFIG_VIDEO_ROCKCHIP_VENC=y
CONFIG_VIDEO_ROCKCHIP_RKJPEG=y
CONFIG_ROCKCHIP_RGA3=y

# === Disable ARM Proprietary Mali Drivers ===
# (Panfrost open-source driver is used instead - see gpu-panfrost.cfg)
# CONFIG_MALI400 is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_KBASE is not set
# CONFIG_MALI_UTGARD is not set

# === Disable Legacy RGA ===
# (RGA3 is used instead)
# CONFIG_ROCKCHIP_RGA is not set
# CONFIG_ROCKCHIP_RGA2 is not set
