# Radxa Zero 3W kernel configuration fragment
# Only augments rockchip_linux_defconfig

# IMX708 camera sensor
CONFIG_VIDEO_IMX708=m

# AIC8800 WiFi/Bluetooth
CONFIG_AIC8800_WLAN_SUPPORT=m

CONFIG_REGULATOR=y
CONFIG_REGULATOR_FAN53555=y

CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_GEM_SHMEM_HELPER=y
CONFIG_DRM_SCHED=y
CONFIG_DRM_PANFROST=y
CONFIG_IOMMU_SUPPORT=y
CONFIG_ROCKCHIP_IOMMU=y
CONFIG_DRM_GEM_SHMEM_HELPER=y

# ARM proprietary stacks – disable hard
# CONFIG_MALI400 is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_KBASE is not set
# CONFIG_MALI_UTGARD is not set

# Legacy RGA disable
# CONFIG_ROCKCHIP_RGA is not set
# CONFIG_ROCKCHIP_RGA2 is not set

CONFIG_IOMMU_API=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_V4L2_MEM2MEM_DEV=y
CONFIG_VIDEO_DEV=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_VIDEO_ROCKCHIP_VDEC=y
CONFIG_VIDEO_ROCKCHIP_VENC=y
CONFIG_VIDEO_ROCKCHIP_RKJPEG=y
CONFIG_ROCKCHIP_RGA3=y